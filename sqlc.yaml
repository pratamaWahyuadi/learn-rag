version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "internal/database/queries/"
    gen:
      go:
        package: "queries"
        out: "internal/database/queries"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "pg_catalog.vector"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              type: "Vector"
          - db_type: "uuid"
            go_type: "string"
