# Continuous Integration for the RAG pipeline.
#
# Runs against a real Postgres + pgvector service so both unit and integration
# tests are exercised on every push/PR, mirroring the local `make test` and
# `make test-integration` targets.
name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Used by goose migrations and the Go integration tests (build tag
      # `integration`). Matches the docker-compose default connection string.
      DATABASE_URL: postgres://rag:rag@localhost:5432/rag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.3

      - name: Verify goose
        run: goose --version

      - name: Run migrations
        run: goose -dir migrations postgres "$DATABASE_URL" up

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        run: go test -tags integration ./...
